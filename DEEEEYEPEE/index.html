<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Circuito</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
    />
    <style>
      html, body, #root { min-height: 100%; margin: 0; background: #f3f7f2; }
      html[data-theme="dark"], html[data-theme="dark"] body, html[data-theme="dark"] #root { background: #121714; }
      .boot { font-family: Segoe UI, system-ui, sans-serif; padding: 32px 20px; color: #1c2b24; }
      html[data-theme="dark"] .boot { color: #e8f0ea; }
    </style>
    <script>
      try {
        var t = localStorage.getItem("circuito-theme");
        if (t === "dark" || t === "light") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root">
      <div class="boot">
        <p>Starting Circuito…</p>
        <p>If this does not change, run <code>npm run dev</code> and open <strong>http://127.0.0.1:5173</strong> (not the HTML file).</p>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
